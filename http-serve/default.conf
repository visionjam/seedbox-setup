server {
    listen 80;
    root /srv;
    charset utf-8;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    auth_basic "seedbox files";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 免密拉取路径片段（内容含机密、不进 git；由 rotate-secret-path.sh 生成/轮换）
    include /etc/nginx/snippets/secret-path.conf;
}
