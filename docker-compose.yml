services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
      - TORRENTING_PORT=45012
    volumes:
      - ./qb-config:/config
      - ./downloads:/downloads
      - ./ee/qbittorrent-nox:/app/qbittorrent-nox:ro   # EE 官方静态二进制（bootstrap 自动下载）
    ports:
      - "8080:8080"        # WebUI（浏览器访问这个）
      - "45012:45012"      # BT TCP 做种端口（公网可达）
      - "45012:45012/udp"  # BT uTP/UDP

  files:
    image: nginx:alpine
    container_name: files
    restart: unless-stopped
    volumes:
      - ./downloads:/srv:ro
      - ./http-serve/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./http-serve/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./http-serve/secret-path.conf:/etc/nginx/snippets/secret-path.conf:ro  # 免密拉取路径片段（server 级 include；rotate-secret-path.sh 生成，不进 git）
      - ./http-serve/secret-logs:/var/log/secret                               # 免密路径专属日志（哨兵用，持久化）
    ports:
      - "8899:80"          # HTTP 文件服务（拉回用；支持 Range、basic auth）

  slskd:
    image: slskd/slskd:0.26.0
    container_name: slskd
    restart: unless-stopped
    user: "1000:1000"
    env_file: ./slskd.env
    volumes:
      - ./slskd-config:/app
      - ./downloads:/downloads
    ports:
      - "8090:5030"        # WebUI（浏览器访问这个）
      - "50300:50300"      # Soulseek 监听口（公网可达）
